name: Build Binaries

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: # Manual runs build and upload artifacts but publish nothing

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.label }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            ext: zip
          # Apple Silicon only. Every standard GitHub-hosted macOS runner is
          # arm64 now: macos-13 was the last free Intel image and has been
          # retired, and the remaining Intel labels (macos-*-intel, macos-*-large)
          # are larger runners, which GitHub bills even on public repositories.
          # R packages with compiled code cannot be cross-compiled, so an Intel
          # binary would need a native Intel machine. Intel Mac users install
          # from source instead -- see README.
          - os: macos-latest
            label: macOS-arm64
            ext: tgz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Installs and caches the dependencies declared in DESCRIPTION rather
      # than a hand-maintained list. "hard" = Depends/Imports/LinkingTo, which
      # is all a binary build needs (vignettes are not rebuilt).
      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgbuild
          dependencies: '"hard"'

      # dest_path is a workspace-relative directory on purpose. Interpolating
      # ${{ runner.temp }} into a bash script breaks on Windows, where it is a
      # backslash path that bash would treat as escapes.
      # pipefail matters: without it the exit status of `... | tee` is tee's,
      # so a failed build would not fail the step.
      - name: Build binary package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pkgbuild-out
          Rscript -e 'pkgbuild::build(binary = TRUE, dest_path = "pkgbuild-out", args = c("--no-multiarch", "--preclean", "--clean"))'
          VER=$(Rscript -e 'cat(read.dcf("DESCRIPTION")[1,"Version"])')
          ART=$(ls -1 pkgbuild-out/multinomialTS_*.${{ matrix.ext }} | head -n 1)
          NEW="pkgbuild-out/multinomialTS_${VER}-${{ matrix.label }}.${{ matrix.ext }}"
          mv "$ART" "$NEW"
          echo "Built: $NEW"
          ls -l pkgbuild-out

      # Confirms the asset name matches what was actually built. Before 1.1.0
      # both macOS binaries came off the same Apple Silicon runner, so the one
      # published as x86_64 was really arm64 and would not load on an Intel Mac.
      - name: Verify macOS architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cd pkgbuild-out
          tar xzf multinomialTS_*-${{ matrix.label }}.tgz
          FOUND=$(lipo -archs multinomialTS/libs/multinomialTS.so)
          echo "Shared object architectures: $FOUND"
          if ! echo "$FOUND" | grep -qw arm64; then
            echo "::error::${{ matrix.label }} should be arm64 but built $FOUND"
            exit 1
          fi
          rm -rf multinomialTS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: multinomialTS-${{ matrix.label }}
          path: pkgbuild-out/multinomialTS_*-${{ matrix.label }}.${{ matrix.ext }}
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    # Only publish for an actual version tag. Without this guard a manual
    # workflow_dispatch run would create a release named after the branch.
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/**/*.tgz
            artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
