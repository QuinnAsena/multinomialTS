name: Build Binaries

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: # Enables manual runs for GHA debugging

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.label }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            ext: zip
          # macos-14 and later runners are Apple Silicon; macos-13 is the last
          # Intel runner. R packages with compiled code cannot be
          # cross-compiled, so each architecture needs its own native runner.
          - os: macos-latest
            label: macOS-arm64
            ext: tgz
          - os: macos-13
            label: macOS-x86_64
            ext: tgz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Installs and caches the dependencies declared in DESCRIPTION rather
      # than a hand-maintained list.
      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgbuild
          dependencies: '"hard"'

      - name: Build binary package
        id: build
        shell: bash
        run: |
          set -e
          mkdir -p "${{ runner.temp }}/build"
          Rscript -e 'pkgbuild::build(binary = TRUE, dest_path = Sys.getenv("DEST"), args = c("--no-multiarch", "--preclean", "--clean"))' \
            2>&1 | tee build.log
          VER=$(Rscript -e 'cat(read.dcf("DESCRIPTION")[1,"Version"])')
          ART=$(ls -1 "${{ runner.temp }}/build"/multinomialTS_*.${{ matrix.ext }} | head -n 1)
          NEW="${{ runner.temp }}/build/multinomialTS_${VER}-${{ matrix.label }}.${{ matrix.ext }}"
          mv "$ART" "$NEW"
          echo "Built: $NEW"
          echo "artifact=$NEW" >> "$GITHUB_OUTPUT"
        env:
          DEST: ${{ runner.temp }}/build

      # Guards against shipping a binary built for the wrong architecture, which
      # is what happened when both macOS builds ran on the same runner.
      - name: Verify macOS architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          cd "${{ runner.temp }}/build"
          tar xzf multinomialTS_*-${{ matrix.label }}.tgz
          FOUND=$(lipo -archs multinomialTS/libs/multinomialTS.so)
          echo "Shared object architectures: $FOUND"
          case "${{ matrix.label }}" in
            macOS-arm64)  EXPECT=arm64 ;;
            macOS-x86_64) EXPECT=x86_64 ;;
          esac
          if ! echo "$FOUND" | grep -qw "$EXPECT"; then
            echo "::error::Expected $EXPECT but built $FOUND"
            exit 1
          fi

      - name: Upload Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: multinomialTS-${{ matrix.label }}
          path: ${{ runner.temp }}/build/multinomialTS_*-${{ matrix.label }}.${{ matrix.ext }}

  release:
    runs-on: ubuntu-latest
    needs: build
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/**/*.tgz
            artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
