name: Build Binaries

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: # Manual runs build and upload artifacts but publish nothing

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.label }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            ext: zip
          # macos-14 and later runners are Apple Silicon; macos-13 is the last
          # Intel runner. R packages with compiled code cannot be
          # cross-compiled, so each architecture needs its own native runner.
          - os: macos-latest
            label: macOS-arm64
            ext: tgz
          - os: macos-13
            label: macOS-x86_64
            ext: tgz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Installs and caches the dependencies declared in DESCRIPTION rather
      # than a hand-maintained list. "hard" = Depends/Imports/LinkingTo, which
      # is all a binary build needs (vignettes are not rebuilt).
      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgbuild
          dependencies: '"hard"'

      # dest_path is a workspace-relative directory on purpose. Interpolating
      # ${{ runner.temp }} into a bash script breaks on Windows, where it is a
      # backslash path that bash would treat as escapes.
      # pipefail matters: without it the exit status of `... | tee` is tee's,
      # so a failed build would not fail the step.
      - name: Build binary package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pkgbuild-out
          Rscript -e 'pkgbuild::build(binary = TRUE, dest_path = "pkgbuild-out", args = c("--no-multiarch", "--preclean", "--clean"))'
          VER=$(Rscript -e 'cat(read.dcf("DESCRIPTION")[1,"Version"])')
          ART=$(ls -1 pkgbuild-out/multinomialTS_*.${{ matrix.ext }} | head -n 1)
          NEW="pkgbuild-out/multinomialTS_${VER}-${{ matrix.label }}.${{ matrix.ext }}"
          mv "$ART" "$NEW"
          echo "Built: $NEW"
          ls -l pkgbuild-out

      # Guards against shipping a binary built for the wrong architecture, which
      # is what happened when both macOS builds ran on the same runner.
      - name: Verify macOS architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cd pkgbuild-out
          tar xzf multinomialTS_*-${{ matrix.label }}.tgz
          FOUND=$(lipo -archs multinomialTS/libs/multinomialTS.so)
          echo "Shared object architectures: $FOUND"
          case "${{ matrix.label }}" in
            macOS-arm64)  EXPECT=arm64 ;;
            macOS-x86_64) EXPECT=x86_64 ;;
          esac
          if ! echo "$FOUND" | grep -qw "$EXPECT"; then
            echo "::error::Expected $EXPECT but built $FOUND"
            exit 1
          fi
          rm -rf multinomialTS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: multinomialTS-${{ matrix.label }}
          path: pkgbuild-out/multinomialTS_*-${{ matrix.label }}.${{ matrix.ext }}
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    # Only publish for an actual version tag. Without this guard a manual
    # workflow_dispatch run would create a release named after the branch.
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/**/*.tgz
            artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
