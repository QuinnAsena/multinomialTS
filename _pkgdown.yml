url: https://quinnasena.github.io/multinomialTS/
template:
  bootstrap: 5
  bootswatch: darkly

reference:
- title: State-Space Model
  desc: Fit and interrogate multinomial state-space models
  contents:
  - mnTS
  - bootstrap.mnTS
  - coef.mnTS
  - simulate.mnTS
  - summary.mnTS
  - print.mnTS
- title: Generalized Linear Mixed Model
  desc: Fit multinomial GLMMs (typically used to initialise mnTS)
  contents:
  - mnGLMM
  - summary.mnGLMM
  - print.mnGLMM
- title: Generic functions
  contents:
  - bootstrap
- title: Datasets
  desc: Example datasets bundled with the package
  contents:
  - story_pollen_wide
  - story_pollen_matrix
  - story_char_wide
  - story_char_matrix
  - sunfish_pollen_wide
  - sunfish_ll
- title: Deprecated
  desc: Retained for backwards compatibility; will be removed in a future release
  contents:
  - boot

articles:
- title: Vignettes
  contents:
  - multinomialTS-vignette
  - sunfish_pond_example

